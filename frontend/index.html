<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seal Detector Pro | Live Stream</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: "Inter", sans-serif;
      }
      /* Fullscreen Video Container */
      .video-viewport {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      #result-display {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      /* Floating Settings UI */
      .settings-panel {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 100;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(10px);
        padding: 20px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        width: 320px;
        transition: transform 0.3s ease-in-out;
      }
      .settings-panel.hidden-panel {
        transform: translateX(340px);
      }
      .toggle-btn {
        position: absolute;
        left: -50px;
        top: 0;
        background: rgba(15, 23, 42, 0.9);
        color: white;
        padding: 12px;
        border-radius: 12px 0 0 12px;
        cursor: pointer;
      }
      .loading-spinner {
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top: 3px solid #3b82f6;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="video-viewport">
      <div id="loading-state" class="flex flex-col items-center">
        <div class="loading-spinner mb-4"></div>
        <p class="text-white text-sm font-medium">Connecting to Stream...</p>
      </div>
      <img id="result-display" class="hidden" alt="RTSP Stream" />
    </div>

    <div id="settings-panel" class="settings-panel">
      <div id="toggle-settings" class="toggle-btn shadow-lg">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="15 12a3 3 0 11-6 0 3 3 0 016 0z"
          />
        </svg>
      </div>

      <h2 class="text-xl font-bold text-white mb-4">Configuration</h2>

      <div class="mb-4">
        <label
          class="block text-xs font-bold text-blue-400 uppercase tracking-wider mb-2"
          >RTSP Stream URL</label
        >
        <input
          type="text"
          id="rtsp-input"
          placeholder="rtsp://admin:pass@ip:port/stream"
          class="w-full bg-slate-800 border border-slate-700 text-white p-3 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>

      <button
        id="save-button"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-lg font-bold transition-all shadow-lg"
      >
        Update & Save
      </button>

      <p class="text-[10px] text-gray-400 mt-4 leading-relaxed">
        The URL is saved locally in your browser. Hide this panel using the gear
        icon.
      </p>
    </div>

    <script>
      const rtspInput = document.getElementById("rtsp-input");
      const saveButton = document.getElementById("save-button");
      const resultDisplay = document.getElementById("result-display");
      const loadingState = document.getElementById("loading-state");
      const settingsPanel = document.getElementById("settings-panel");
      const toggleSettings = document.getElementById("toggle-settings");

      // 1. Load Saved URL on startup
      window.addEventListener("DOMContentLoaded", () => {
        const savedUrl = localStorage.getItem("rtsp_url");
        if (savedUrl) {
          rtspInput.value = savedUrl;
          startStream(savedUrl);
          // Hide panel automatically if we have a saved URL
          settingsPanel.classList.add("hidden-panel");
        } else {
          loadingState.querySelector("p").innerText =
            "Please configure RTSP URL";
          loadingState
            .querySelector(".loading-spinner")
            .classList.add("hidden");
        }
      });

      // 2. Toggle Settings Panel
      toggleSettings.addEventListener("click", () => {
        settingsPanel.classList.toggle("hidden-panel");
      });

      // 3. Save and Start Stream
      saveButton.addEventListener("click", () => {
        const url = rtspInput.value.trim();
        if (!url) return alert("Please enter a valid URL");

        localStorage.setItem("rtsp_url", url);
        startStream(url);

        // Visual feedback
        saveButton.innerText = "Saved!";
        setTimeout(() => {
          saveButton.innerText = "Update & Save";
          settingsPanel.classList.add("hidden-panel");
        }, 800);
      });

      function startStream(url) {
        loadingState.classList.remove("hidden");
        resultDisplay.classList.add("hidden");

        // Pointing to your backend endpoint
        const backendUrl = `/predict/rtsp?url=${encodeURIComponent(url)}`;

        resultDisplay.src = backendUrl;

        resultDisplay.onload = () => {
          loadingState.classList.add("hidden");
          resultDisplay.classList.remove("hidden");
        };

        resultDisplay.onerror = () => {
          loadingState.classList.remove("hidden");
          loadingState.querySelector("p").innerText =
            "Stream Error - Check URL";
          loadingState
            .querySelector(".loading-spinner")
            .classList.add("hidden");
        };
      }
    </script>
  </body>
</html>
